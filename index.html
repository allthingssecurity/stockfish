<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chess vs Stockfish</title>
  <link rel="stylesheet" href="vendor/chessboard.min.css" />
  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f7f7f9;
    }
    .container {
      max-width: 980px;
      margin: 24px auto;
      padding: 0 16px;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 12px;
    }
    .layout {
      display: flex;
      gap: 24px;
      align-items: flex-start;
    }
    #board {
      width: 480px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }
    .panel {
      flex: 1;
      background: white;
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }
    .row {
      margin-bottom: 12px;
    }
    .log {
      height: 260px;
      overflow: auto;
      background: #0b1020;
      color: #e9f0ff;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      padding: 8px;
      border-radius: 6px;
    }
    .btn {
      display: inline-block;
      background: #1967d2;
      color: white;
      border: 0;
      border-radius: 6px;
      padding: 8px 12px;
      cursor: pointer;
      font-weight: 600;
    }
    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .status {
      font-weight: 600;
    }
    .label {
      color: #364a63;
      font-size: 12px;
      margin-right: 6px;
    }
    select, input[type=number] {
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid #d0d7de;
    }
    /* Click-to-move highlighting */
    #board .square-55d63 { cursor: pointer; }
    #board .highlight-source {
      box-shadow: inset 0 0 0 4px #f39c12 !important;
      background-color: rgba(243, 156, 18, 0.4) !important;
    }
    #board .highlight-target {
      box-shadow: inset 0 0 0 4px #27ae60 !important;
      background-color: rgba(39, 174, 96, 0.4) !important;
    }
    #board .highlight-legal {
      background: radial-gradient(circle, rgba(0,0,0,0.25) 20%, transparent 20%) center !important;
    }
    #board .highlight-legal-capture {
      box-shadow: inset 0 0 0 4px rgba(255,0,0,0.5) !important;
    }
    .move-hint {
      font-size: 11px;
      color: #666;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Chess vs Stockfish 17</h1>
    <div class="layout">
      <div id="board"></div>
      <div class="panel">
        <div class="row controls">
          <span class="label">You play:</span>
          <select id="humanColor">
            <option value="white" selected>White</option>
            <option value="black">Black</option>
          </select>
          <span class="label">Depth:</span>
          <input id="depth" type="number" value="10" min="1" max="20" />
          <button id="newGame" class="btn">New game</button>
        </div>
        <div class="row"><span class="status" id="status">Loading engine...</span></div>
        <div class="move-hint">Click piece to select, then click target. Or drag pieces.</div>
        <div class="row">
          <div class="log" id="log"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="vendor/jquery.min.js"></script>
  <script src="chess.min.js"></script>
  <script src="vendor/chessboard.min.js"></script>
  <script>
    const logEl = document.getElementById('log');
    const statusEl = document.getElementById('status');

    function log(msg) {
      const time = new Date().toLocaleTimeString();
      logEl.textContent += `[${time}] ${msg}\n`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    // Create engine worker
    const engine = new Worker('src/stockfish.js');
    let engineReady = false;
    let engineThinking = false;

    function sendCmd(cmd) {
      log('> ' + cmd);
      engine.postMessage(cmd);
    }

    engine.onmessage = function(e) {
      const line = typeof e === 'string' ? e : (e.data || '');
      if (!line) return;

      if (!line.startsWith('info') || line.includes('score')) {
        log(line);
      }

      if (line === 'uciok') {
        log('Engine loaded');
        sendCmd('isready');
      } else if (line === 'readyok') {
        engineReady = true;
        statusEl.textContent = 'Engine ready';
        log('Engine ready');
        if (pendingMove) {
          const fn = pendingMove;
          pendingMove = null;
          fn();
        }
      } else if (line.startsWith('bestmove')) {
        const match = line.match(/^bestmove\s+([a-h][1-8])([a-h][1-8])([qrbn])?/);
        if (match) {
          engineThinking = false;
          const from = match[1];
          const to = match[2];
          const promo = match[3];
          const move = promo ? { from, to, promotion: promo } : { from, to };
          const result = game.move(move);
          if (result) {
            clearHighlights();
            highlightSquare(from, 'highlight-source');
            highlightSquare(to, 'highlight-target');
            board.position(game.fen());
            updateStatus();
          } else {
            log('ERROR: Engine move was illegal: ' + line);
          }
        }
      }
    };

    engine.onerror = function(e) {
      log('ENGINE ERROR: ' + e.message);
      statusEl.textContent = 'Engine error!';
    };

    sendCmd('uci');

    // Chess game
    const game = new Chess();
    let humanPlays = 'white';
    let pendingMove = null;
    let selectedSquare = null;

    // Track mouse for click vs drag detection
    let mouseDownSquare = null;
    let mouseDownTime = 0;
    let mouseDownX = 0;
    let mouseDownY = 0;
    let dragMoveOccurred = false;

    const board = Chessboard('board', {
      draggable: true,
      position: 'start',
      pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
      onDragStart: function(source, piece) {
        if (game.game_over()) return false;
        const turn = game.turn() === 'w' ? 'white' : 'black';
        if (turn !== humanPlays) return false;
        if (humanPlays === 'white' && piece.search(/^b/) !== -1) return false;
        if (humanPlays === 'black' && piece.search(/^w/) !== -1) return false;
        return true;
      },
      onDrop: function(source, target) {
        // If dropped on different square, it's a real drag move
        if (source !== target) {
          dragMoveOccurred = true;
          clearHighlights();
          selectedSquare = null;

          const piece = game.get(source);
          let promotion = 'q';
          if (piece && piece.type === 'p') {
            if ((piece.color === 'w' && target[1] === '8') || (piece.color === 'b' && target[1] === '1')) {
              promotion = prompt('Promote to (q/r/b/n):', 'q') || 'q';
            }
          }

          const move = game.move({ from: source, to: target, promotion: promotion });
          if (move === null) return 'snapback';

          highlightSquare(source, 'highlight-source');
          highlightSquare(target, 'highlight-target');
          updateStatus();
          setTimeout(makeEngineMove, 100);
        } else {
          // Dropped on same square = click, handle it directly
          setTimeout(function() {
            handleSquareClick(source);
          }, 10);
        }
      },
      onSnapEnd: function() {
        board.position(game.fen());
      }
    });

    // Helper functions for highlighting
    function clearHighlights() {
      $('#board .square-55d63').removeClass('highlight-source highlight-target highlight-legal highlight-legal-capture');
    }

    function highlightSquare(square, className) {
      const $square = $('#board .square-55d63[data-square="' + square + '"]');
      if ($square.length) {
        $square.addClass(className);
      }
    }

    function showLegalMoves(square) {
      const moves = game.moves({ square: square, verbose: true });
      moves.forEach(function(move) {
        const targetPiece = game.get(move.to);
        if (targetPiece) {
          highlightSquare(move.to, 'highlight-legal-capture');
        } else {
          highlightSquare(move.to, 'highlight-legal');
        }
      });
    }

    function getSquareFromElement(el) {
      const $el = $(el);
      if ($el.attr('data-square')) return $el.attr('data-square');
      const $parent = $el.closest('[data-square]');
      if ($parent.length) return $parent.attr('data-square');
      return null;
    }

    function handleSquareClick(square) {
      if (!square) return;
      if (game.game_over()) return;
      if (engineThinking) return;

      const turnColor = game.turn() === 'w' ? 'white' : 'black';
      if (turnColor !== humanPlays) return;

      const piece = game.get(square);

      // If no square selected yet - select a piece
      if (!selectedSquare) {
        if (!piece || (piece.color === 'w' ? 'white' : 'black') !== humanPlays) return;

        clearHighlights();
        selectedSquare = square;
        highlightSquare(square, 'highlight-source');
        showLegalMoves(square);
        statusEl.textContent = 'Selected ' + square.toUpperCase() + ' - click target square';
        return;
      }

      // Clicking same square - deselect
      if (selectedSquare === square) {
        clearHighlights();
        selectedSquare = null;
        updateStatus();
        return;
      }

      // Clicking another own piece - switch selection
      if (piece && (piece.color === 'w' ? 'white' : 'black') === humanPlays) {
        clearHighlights();
        selectedSquare = square;
        highlightSquare(square, 'highlight-source');
        showLegalMoves(square);
        statusEl.textContent = 'Selected ' + square.toUpperCase() + ' - click target square';
        return;
      }

      // Try to make the move to target square
      const from = selectedSquare;
      const to = square;
      const movingPiece = game.get(from);

      let moveObj = { from, to };

      if (movingPiece && movingPiece.type === 'p') {
        if ((movingPiece.color === 'w' && to[1] === '8') || (movingPiece.color === 'b' && to[1] === '1')) {
          moveObj.promotion = prompt('Promote to (q/r/b/n):', 'q') || 'q';
        }
      }

      const move = game.move(moveObj);
      if (move === null) {
        statusEl.textContent = 'Illegal move - try again';
        return;
      }

      clearHighlights();
      highlightSquare(from, 'highlight-source');
      highlightSquare(to, 'highlight-target');
      selectedSquare = null;
      board.position(game.fen());
      updateStatus();
      setTimeout(makeEngineMove, 100);
    }

    // Use mousedown/mouseup to detect clicks vs drags
    $('#board').on('mousedown touchstart', function(e) {
      mouseDownSquare = getSquareFromElement(e.target);
      mouseDownTime = Date.now();
      dragMoveOccurred = false;
    });

    $('#board').on('mouseup touchend', function(e) {
      const elapsed = Date.now() - mouseDownTime;
      const upSquare = getSquareFromElement(e.target);

      // If no drag move occurred and quick click on same square, treat as click
      if (!dragMoveOccurred && elapsed < 200 && mouseDownSquare === upSquare && upSquare) {
        // Use setTimeout to let drag handler finish first
        setTimeout(function() {
          handleSquareClick(upSquare);
        }, 10);
      }

      mouseDownSquare = null;
      dragMoveOccurred = false;
    });

    function updateStatus() {
      if (game.in_checkmate()) {
        const winner = game.turn() === 'w' ? 'Black' : 'White';
        statusEl.textContent = 'Checkmate! ' + winner + ' wins.';
      } else if (game.in_draw()) {
        statusEl.textContent = 'Draw!';
      } else if (game.in_check()) {
        statusEl.textContent = (game.turn() === 'w' ? 'White' : 'Black') + ' is in check';
      } else {
        statusEl.textContent = (game.turn() === 'w' ? 'White' : 'Black') + ' to move';
      }
    }

    function getMoves() {
      const history = game.history({ verbose: true });
      return history.map(m => m.from + m.to + (m.promotion || '')).join(' ');
    }

    function makeEngineMove() {
      if (game.game_over()) return;
      if (engineThinking) return;

      const depth = parseInt(document.getElementById('depth').value) || 10;

      function doMove() {
        engineThinking = true;
        statusEl.textContent = 'Engine thinking (depth ' + depth + ')...';

        const moves = getMoves();
        if (moves) {
          sendCmd('position startpos moves ' + moves);
        } else {
          sendCmd('position startpos');
        }
        sendCmd('go depth ' + depth);
      }

      if (!engineReady) {
        log('Waiting for engine...');
        pendingMove = doMove;
      } else {
        doMove();
      }
    }

    // Controls
    document.getElementById('humanColor').addEventListener('change', function(e) {
      humanPlays = e.target.value;
      board.orientation(humanPlays);
      restartGame();
    });

    document.getElementById('newGame').addEventListener('click', restartGame);

    function restartGame() {
      game.reset();
      board.start();
      engineThinking = false;
      pendingMove = null;
      selectedSquare = null;
      clearHighlights();
      if (engineReady) {
        sendCmd('ucinewgame');
        sendCmd('isready');
      }
      updateStatus();
      if (humanPlays === 'black') {
        setTimeout(makeEngineMove, 300);
      }
    }

    updateStatus();
    window.addEventListener('resize', function() { board.resize(); });
  </script>
</body>
</html>
