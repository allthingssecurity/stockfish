<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chess vs Stockfish</title>
  <link rel="stylesheet" href="vendor/chessboard.min.css" />
  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f7f7f9;
    }
    .container {
      max-width: 980px;
      margin: 24px auto;
      padding: 0 16px;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 12px;
    }
    .layout {
      display: flex;
      gap: 24px;
      align-items: flex-start;
    }
    #board {
      width: 480px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }
    .panel {
      flex: 1;
      background: white;
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }
    .row {
      margin-bottom: 12px;
    }
    .log {
      height: 260px;
      overflow: auto;
      background: #0b1020;
      color: #e9f0ff;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      padding: 8px;
      border-radius: 6px;
    }
    .btn {
      display: inline-block;
      background: #1967d2;
      color: white;
      border: 0;
      border-radius: 6px;
      padding: 8px 12px;
      cursor: pointer;
      font-weight: 600;
    }
    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .status {
      font-weight: 600;
    }
    .label {
      color: #364a63;
      font-size: 12px;
      margin-right: 6px;
    }
    select, input[type=number] {
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid #d0d7de;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Chess vs Stockfish 17</h1>
    <div class="layout">
      <div id="board"></div>
      <div class="panel">
        <div class="row controls">
          <span class="label">You play:</span>
          <select id="humanColor">
            <option value="white" selected>White</option>
            <option value="black">Black</option>
          </select>
          <span class="label">Depth:</span>
          <input id="depth" type="number" value="10" min="1" max="20" />
          <button id="newGame" class="btn">New game</button>
        </div>
        <div class="row"><span class="status" id="status">Loading engine...</span></div>
        <div class="row">
          <div class="log" id="log"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="vendor/jquery.min.js"></script>
  <script src="chess.min.js"></script>
  <script src="vendor/chessboard.min.js"></script>
  <script>
    const logEl = document.getElementById('log');
    const statusEl = document.getElementById('status');

    function log(msg) {
      const time = new Date().toLocaleTimeString();
      logEl.textContent += `[${time}] ${msg}\n`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    // Create engine worker
    const engine = new Worker('src/stockfish.js');
    let engineReady = false;
    let engineThinking = false;

    function sendCmd(cmd) {
      log('> ' + cmd);
      engine.postMessage(cmd);
    }

    engine.onmessage = function(e) {
      const line = typeof e === 'string' ? e : (e.data || '');
      if (!line) return;

      // Log important messages
      if (!line.startsWith('info') || line.includes('score')) {
        log(line);
      }

      if (line === 'uciok') {
        log('Engine loaded');
        sendCmd('isready');
      } else if (line === 'readyok') {
        engineReady = true;
        statusEl.textContent = 'Engine ready';
        log('Engine ready');
        // If pending move, execute it
        if (pendingMove) {
          const fn = pendingMove;
          pendingMove = null;
          fn();
        }
      } else if (line.startsWith('bestmove')) {
        const match = line.match(/^bestmove\s+([a-h][1-8])([a-h][1-8])([qrbn])?/);
        if (match) {
          engineThinking = false;
          const from = match[1];
          const to = match[2];
          const promo = match[3];
          const move = promo ? { from, to, promotion: promo } : { from, to };
          const result = game.move(move);
          if (result) {
            board.position(game.fen());
            updateStatus();
          } else {
            log('ERROR: Engine move was illegal: ' + line);
          }
        }
      }
    };

    engine.onerror = function(e) {
      log('ENGINE ERROR: ' + e.message);
      statusEl.textContent = 'Engine error!';
    };

    // Start UCI
    sendCmd('uci');

    // Chess game
    const game = new Chess();
    let humanPlays = 'white';
    let pendingMove = null;

    const board = Chessboard('board', {
      draggable: true,
      position: 'start',
      pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
      onDragStart: function(source, piece) {
        if (game.game_over()) return false;
        const turn = game.turn() === 'w' ? 'white' : 'black';
        if (turn !== humanPlays) return false;
        if (humanPlays === 'white' && piece.search(/^b/) !== -1) return false;
        if (humanPlays === 'black' && piece.search(/^w/) !== -1) return false;
        return true;
      },
      onDrop: function(source, target) {
        const move = game.move({ from: source, to: target, promotion: 'q' });
        if (move === null) return 'snapback';
        updateStatus();
        setTimeout(makeEngineMove, 100);
      },
      onSnapEnd: function() {
        board.position(game.fen());
      }
    });

    function updateStatus() {
      if (game.in_checkmate()) {
        const winner = game.turn() === 'w' ? 'Black' : 'White';
        statusEl.textContent = 'Checkmate! ' + winner + ' wins.';
      } else if (game.in_draw()) {
        statusEl.textContent = 'Draw!';
      } else if (game.in_check()) {
        statusEl.textContent = (game.turn() === 'w' ? 'White' : 'Black') + ' is in check';
      } else {
        statusEl.textContent = (game.turn() === 'w' ? 'White' : 'Black') + ' to move';
      }
    }

    function getMoves() {
      const history = game.history({ verbose: true });
      return history.map(m => m.from + m.to + (m.promotion || '')).join(' ');
    }

    function makeEngineMove() {
      if (game.game_over()) return;
      if (engineThinking) return;

      const depth = parseInt(document.getElementById('depth').value) || 10;

      function doMove() {
        engineThinking = true;
        statusEl.textContent = 'Engine thinking (depth ' + depth + ')...';

        const moves = getMoves();
        if (moves) {
          sendCmd('position startpos moves ' + moves);
        } else {
          sendCmd('position startpos');
        }
        sendCmd('go depth ' + depth);
      }

      if (!engineReady) {
        log('Waiting for engine...');
        pendingMove = doMove;
      } else {
        doMove();
      }
    }

    // Controls
    document.getElementById('humanColor').addEventListener('change', function(e) {
      humanPlays = e.target.value;
      board.orientation(humanPlays);
      restartGame();
    });

    document.getElementById('newGame').addEventListener('click', restartGame);

    function restartGame() {
      game.reset();
      board.start();
      engineThinking = false;
      pendingMove = null;
      if (engineReady) {
        sendCmd('ucinewgame');
        sendCmd('isready');
      }
      updateStatus();
      if (humanPlays === 'black') {
        setTimeout(makeEngineMove, 300);
      }
    }

    updateStatus();
    window.addEventListener('resize', function() { board.resize(); });
  </script>
</body>
</html>
